<!DOCTYPE html>
<html>

<head>

    <title>Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav>

    <h2>Library Management System</h2>

    <div>

        <a href="/dashboard">Dashboard</a>

        <a href="/books">Books</a>

        <a href="/logout">Logout</a>

    </div>

</nav>


<div class="container">

    <h1>Dashboard</h1>


    <div class="cards">

        <div class="card">

            <h2>{{ total }}</h2>

            <p>Total Books</p>

        </div>


        <div class="card">

            <h2>📚</h2>

            <p>Manage Books</p>

            <a href="/books">
                View Books
            </a>

        </div>

    </div>

</div>

</body>

</html>
