<!DOCTYPE html>
<html>

<head>

    <title>Edit Book</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav>

    <h2>Library Management System</h2>

    <div>

        <a href="/dashboard">Dashboard</a>

        <a href="/books">Books</a>

        <a href="/logout">Logout</a>

    </div>

</nav>


<div class="form-box">

    <h1>Edit Book</h1>


    <form method="POST">


        <input
            type="text"
            name="book_id"
            value="{{ book[1] }}"
            required
        >


        <input
            type="text"
            name="title"
            value="{{ book[2] }}"
            required
        >


        <input
            type="text"
            name="author"
            value="{{ book[3] }}"
            required
        >


        <input
            type="text"
            name="category"
            value="{{ book[4] }}"
            required
        >


        <button type="submit">
            Update Book
        </button>

    </form>

</div>

</body>

</html>
