<!DOCTYPE html>
<html>

<head>

    <title>Book Records</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav>

    <h2>Library Management System</h2>

    <div>

        <a href="/dashboard">Dashboard</a>

        <a href="/books">Books</a>

        <a href="/logout">Logout</a>

    </div>

</nav>


<div class="container">

    <h1>Book Records</h1>

    <a href="/add" class="add-button">
        + Add Book
    </a>


    <table>

        <tr>

            <th>Book ID</th>

            <th>Book Title</th>

            <th>Author</th>

            <th>Category</th>

            <th>Action</th>

        </tr>


        {% for book in books %}

        <tr>

            <td>
                {{ book[1] }}
            </td>

            <td>
                {{ book[2] }}
            </td>

            <td>
                {{ book[3] }}
            </td>

            <td>
                {{ book[4] }}
            </td>

            <td>

                <a
                    class="edit"
                    href="{{ url_for('edit_book', id=book[0]) }}"
                >
                    Edit
                </a>


                <a
                    class="delete"
                    href="{{ url_for('delete_book', id=book[0]) }}"
                    onclick="return confirm('Are you sure you want to delete this book?')"
                >
                    Delete
                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

</div>

</body>

</html>
